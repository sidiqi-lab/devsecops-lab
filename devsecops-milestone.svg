  </text>
  <text x="605" y="621" font-family="Arial" font-size="18" fill="#cbd5e1">
    • Container build
  </text>
  <text x="605" y="653" font-family="Arial" font-size="18" fill="#cbd5e1">
    • Trivy in CI
  </text>

  <!-- Card 6 -->
  <rect x="1070" y="430" width="460" height="280" rx="18"
        fill="#1e293b" filter="url(#shadow)"/>
  <rect x="1070" y="430" width="460" height="12" rx="6" fill="#ef4444"/>

  <text x="1100" y="480" font-family="Arial" font-size="25"
        font-weight="700" fill="#ffffff">
    Milestone 6 — Deployment
  </text>

  <text x="1105" y="525" font-family="Arial" font-size="18" fill="#cbd5e1">
