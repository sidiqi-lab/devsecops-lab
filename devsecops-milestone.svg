  </text>

  <text x="800" y="855"
        text-anchor="middle"
        font-family="Arial" font-size="22"
        fill="#93c5fd">
    GitHub → Terraform → Ansible → Podman → FastAPI → Trivy
  </text>

  <text x="800" y="895"
        text-anchor="middle"
        font-family="Arial" font-size="17"
        fill="#94a3b8">
