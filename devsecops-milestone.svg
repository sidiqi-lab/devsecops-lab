  </text>
  <text x="1105" y="557" font-family="Arial" font-size="18" fill="#cbd5e1">
    • Ansible configuration
  </text>
  <text x="1105" y="589" font-family="Arial" font-size="18" fill="#cbd5e1">
    • Podman deployment
  </text>
  <text x="1105" y="621" font-family="Arial" font-size="18" fill="#cbd5e1">
    • FastAPI :8000
  </text>
  <text x="1105" y="653" font-family="Arial" font-size="18" fill="#cbd5e1">
    • Trivy verification
  </text>
  <text x="1105" y="685" font-family="Arial" font-size="18" fill="#cbd5e1">
