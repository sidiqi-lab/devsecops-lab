  </text>

  <!-- Milestone cards -->

  <!-- Card 1 -->
  <rect x="70" y="160" width="460" height="230" rx="18"
        fill="#1e293b" filter="url(#shadow)"/>
  <rect x="70" y="160" width="460" height="12" rx="6" fill="#22c55e"/>

  <text x="100" y="210" font-family="Arial" font-size="25"
        font-weight="700" fill="#ffffff">
    Milestone 1 — Foundation
  </text>

  <text x="105" y="250" font-family="Arial" font-size="18" fill="#cbd5e1">
    ✓ Git repository
  </text>
  <text x="105" y="282" font-family="Arial" font-size="18" fill="#cbd5e1">
    ✓ Python / FastAPI
  </text>
  <text x="105" y="314" font-family="Arial" font-size="18" fill="#cbd5e1">
